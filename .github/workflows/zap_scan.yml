name: "ZAP Baseline Scan"

on:
  workflow_dispatch:

jobs:
  zap_scan:
    name: ZAP Baseline Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install

      - name: Start Juice Shop
        shell: bash
        run: |
          npm start > juice-shop.log 2>&1 &
          echo $! > juice-shop.pid

      - name: Wait for Juice Shop
        shell: bash
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000 > /dev/null; then
              echo "Juice Shop is available."
              exit 0
            fi

            echo "Waiting for Juice Shop..."
            sleep 5
          done

          echo "Juice Shop did not start."
          cat juice-shop.log
          exit 1

      - name: Run ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: "http://127.0.0.1:3000"
          docker_name: "ghcr.io/zaproxy/zaproxy:stable"
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a -j"
          fail_action: false
          allow_issue_writing: false
          artifact_name: "zap-baseline-report"

      - name: Upload Juice Shop log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: juice-shop-log
          path: juice-shop.log
          if-no-files-found: ignore